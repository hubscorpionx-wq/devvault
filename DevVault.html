<style>
        :root {
            --bg-color: #0b0f19;
            --sidebar-bg: #111827;
            --card-bg: #1f2937;
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;

            --color-lore: #c084fc;
            --color-ideas: #fbbf24;
            --color-todo: #60a5fa;
            --color-bugs: #f87171;
            --color-done: #34d399;

            --prio-low: #38bdf8;
            --prio-med: #facc15;
            --prio-high: #fb923c;
            --prio-crit: #f87171;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .hamburger-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.6rem;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 6px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hamburger-btn:hover {
            background-color: var(--border-color);
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-badge {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            z-index: 200;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 25px rgba(0,0,0,0.5);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .sidebar-close:hover { color: white; }

        .sidebar-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .sidebar-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 20px 0 10px 0;
            font-weight: bold;
        }

        .sidebar-section-title:first-child { margin-top: 0; }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            margin-bottom: 5px;
        }

        .sidebar-btn {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 12px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .sidebar-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .sidebar-btn.active {
            background-color: var(--accent-color);
            color: #0b0f19;
            font-weight: bold;
        }

        .project-select-custom {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            z-index: 150;
            display: none;
        }

        .overlay.active { display: block; }

        .main-container {
            margin-top: 60px;
            padding: 25px;
            width: 100%;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }

        .page { display: none; }
        .page.active { display: block; }

        .panel-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1.5fr 2fr 180px 110px;
            gap: 12px;
        }

        .form-grid-code {
            display: grid;
            grid-template-columns: 1.5fr 160px 110px;
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-grid-img {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: center;
        }

        .form-grid input, .form-grid textarea, .form-grid select,
        .form-grid-code input, .form-grid-code select,
        .form-grid-img input {
            background-color: #0d1322;
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
        }

        .form-grid textarea, .code-textarea { resize: vertical; min-height: 40px; }

        .code-textarea {
            width: 100%;
            background-color: #0d1322;
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            font-family: 'Consolas', monospace;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: #0b0f19;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .btn-submit:hover { opacity: 0.9; }

        .btn-danger {
            background: none;
            border: 1px solid var(--color-bugs);
            color: var(--color-bugs);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            width: 100%;
            text-align: left;
        }

        .btn-danger:hover { background-color: var(--color-bugs); color: white; }

        .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }

        .section-column {
            background-color: rgba(31, 41, 55, 0.4);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 15px;
            min-height: 500px;
        }

        .section-column.drag-over { background-color: rgba(56, 189, 248, 0.1); border-color: var(--accent-color); }

        .section-header {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge-count { background-color: var(--border-color); color: white; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; }

        .note-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid #ccc;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: grab;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .note-card.lore { border-left-color: var(--color-lore); }
        .note-card.ideas { border-left-color: var(--color-ideas); }
        .note-card.todo { border-left-color: var(--color-todo); }
        .note-card.bugs { border-left-color: var(--color-bugs); }
        .note-card.done { border-left-color: var(--color-done); }

        .note-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .note-title { font-weight: bold; font-size: 0.95rem; }

        .prio-select {
            background-color: #0d1322;
            border: 1px solid var(--border-color);
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            cursor: pointer;
        }

        .prio-select.nessuna { color: var(--text-muted); }
        .prio-select.bassa { color: var(--prio-low); }
        .prio-select.media { color: var(--prio-med); }
        .prio-select.alta { color: var(--prio-high); }
        .prio-select.critico { color: var(--prio-crit); }

        .note-body { font-size: 0.85rem; color: var(--text-muted); white-space: pre-wrap; margin-top: 6px; }
        .note-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.05); }

        .code-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 20px; }
        .code-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; }
        .code-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .code-lang-tag { background-color: rgba(56, 189, 248, 0.2); color: var(--accent-color); font-size: 0.75rem; font-weight: bold; padding: 3px 8px; border-radius: 4px; }
        .code-block { background-color: #0d1322; border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; color: #38bdf8; font-family: 'Consolas', monospace; font-size: 0.85rem; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }

        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .image-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        
        .image-card-img-wrapper {
            width: 100%;
            height: 200px;
            background-color: #0d1322;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .image-title { font-weight: bold; font-size: 0.95rem; }
        .image-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; margin-bottom: 10px; }

        .btn-card { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; }
        .btn-card:hover { color: white; background-color: var(--border-color); }
        .btn-card.delete:hover { color: var(--color-bugs); }

/* AUTH SCREEN */
.auth-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;

}

.auth-card {
    width: 100%;
    max-width: 420px;
    background-color: #111827;
    border: 1px solid var(--border-color);

    padding: 35px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    text-align: center;
}

.auth-logo {
    width: 65px;
    height: 65px;
    margin: 0 auto 15px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background-color: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.3);

}

.auth-card h1 { margin: 0; font-size: 1.8rem; }
.auth-card p { color: var(--text-muted); margin-top: 8px; margin-bottom: 25px; }

.auth-input {
    width: 100%;
    background-color: #0d1322;
    border: 1px solid var(--border-color);
    color: white;
    padding: 13px;
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 12px;
    outline: none;
}

.auth-input:focus { border-color: var(--accent-color); }

.auth-button {
    width: 100%;
    background-color: var(--accent-color);
    color: #0b0f19;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 5px;
}

.auth-button:hover { opacity: 0.9; }

.auth-switch {
    background: none;
    border: none;
    color: var(--accent-color);
    cursor: pointer;
    margin-top: 18px;
    font-size: 0.85rem;
}

.auth-switch:hover { text-decoration: underline; }
.auth-message { min-height: 20px; margin-top: 15px; font-size: 0.85rem; color: var(--text-muted); }

@media (max-width: 768px) {
    .form-grid, .form-grid-code, .form-grid-img { grid-template-columns: 1fr; }
    .code-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
    <div class="auth-card">
        <div class="auth-logo">⚡</div>
        <h1>DevVault</h1>
        <p id="authSubtitle">Accedi al tuo Game Dev Studio</p>

        <!-- LOGIN -->
        <div id="loginForm">
            <input type="email" id="loginEmail" class="auth-input" placeholder="Email" autocomplete="email">
            <input type="password" id="loginPassword" class="auth-input" placeholder="Password" autocomplete="current-password">
            <button class="auth-button" onclick="loginUser()">🔐 Accedi</button>
            <button class="auth-switch" onclick="showRegister()">Non hai un account? Registrati</button>
        </div>

        <!-- REGISTRAZIONE -->
        <div id="registerForm" style="display:none;">
            <input type="email" id="registerEmail" class="auth-input" placeholder="Email" autocomplete="email">
            <input type="password" id="registerPassword" class="auth-input" placeholder="Password" autocomplete="new-password">
            <input type="password" id="registerPasswordConfirm" class="auth-input" placeholder="Ripeti password" autocomplete="new-password">
            <button class="auth-button" onclick="registerUser()">👤 Crea Account</button>
            <button class="auth-switch" onclick="showLogin()">Hai già un account? Accedi</button>
        </div>

        <div id="authMessage" class="auth-message"></div>
    </div>
</div>

<div class="topbar">
    <div class="topbar-left">
        <button class="hamburger-btn" onclick="toggleSidebar()" title="Apri Menu">☰</button>
        <div class="brand-title">
            ⚡ DevVault
            <span class="current-badge" id="topbarProjectName">Seleziona Progetto</span>
        </div>
    </div>
    <div style="font-size: 0.85rem; color: var(--text-muted);" id="topbarSectionName">📌 Tabellone Kanban</div>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <strong style="font-size: 1.1rem;">⚙️ Navigazione</strong>
        <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    
    <div class="sidebar-content">
        <div class="sidebar-section-title">🎮 Seleziona Gioco</div>
        <select class="project-select-custom" id="projectSelect" onchange="switchProject(this.value)"></select>
        <button class="sidebar-btn" onclick="createNewProject()">➕ Nuovo Progetto</button>
        <button class="btn-danger" style="margin-top: 5px;" onclick="deleteCurrentProject()">🗑️ Elimina Progetto</button>

        <div class="sidebar-section-title">📂 Sezioni</div>
        <ul class="sidebar-menu">
            <li>
                <button class="sidebar-btn active" id="btnNavBoard" onclick="navigateTo('boardPage', '📌 Tabellone Kanban', this)">
                    📌 Tabellone Kanban
                </button>
            </li>
            <li>
                <button class="sidebar-btn" id="btnNavCode" onclick="navigateTo('codePage', '💻 Code & Script Vault', this)">
                    💻 Code & Script Vault
                </button>
            </li>
            <li>
                <button class="sidebar-btn" id="btnNavImages" onclick="navigateTo('imagesPage', '🖼️ Gallery & Reference', this)">
                    🖼️ Gallery & Reference
                </button>
            </li>
        </ul>

        <div style="margin-top:20px; border-top:1px solid var(--border-color); padding-top:15px;">
            <button class="sidebar-btn" onclick="logoutUser()">🚪 Logout</button>
        </div>
    </div>
</div>

<div class="main-container">

    <div id="boardPage" class="page active">
        <div class="panel-box">
            <div class="form-grid">
                <input type="text" id="noteTitle" placeholder="Titolo scheda...">
                <textarea id="noteBody" placeholder="Dettagli, spiegazioni, lore..."></textarea>
                <select id="noteCategory">
                    <option value="lore">📖 Lore & Mondo</option>
                    <option value="ideas">💡 Idee & Meccaniche</option>
                    <option value="todo">📝 Da Fare</option>
                    <option value="bugs">🐛 Bug & Problemi</option>
                    <option value="done">✅ Completati</option>
                </select>
                <button class="btn-submit" onclick="addNote()">Aggiungi</button>
            </div>
        </div>

        <div class="board">
            <div class="section-column" id="col-lore" ondragover="allowDrop(event)" ondragleave="clearDrag(event)" ondrop="drop(event, 'lore')">
                <div class="section-header" style="color: var(--color-lore);">
                    <span>📖 Lore & Mondo</span>
                    <span class="badge-count" id="count-lore">0</span>
                </div>
                <div class="cards-container"></div>
            </div>

            <div class="section-column" id="col-ideas" ondragover="allowDrop(event)" ondragleave="clearDrag(event)" ondrop="drop(event, 'ideas')">
                <div class="section-header" style="color: var(--color-ideas);">
                    <span>💡 Idee & Meccaniche</span>
                    <span class="badge-count" id="count-ideas">0</span>
                </div>
                <div class="cards-container"></div>
            </div>

            <div class="section-column" id="col-todo" ondragover="allowDrop(event)" ondragleave="clearDrag(event)" ondrop="drop(event, 'todo')">
                <div class="section-header" style="color: var(--color-todo);">
                    <span>📝 Da Fare</span>
                    <span class="badge-count" id="count-todo">0</span>
                </div>
                <div class="cards-container"></div>
            </div>

            <div class="section-column" id="col-bugs" ondragover="allowDrop(event)" ondragleave="clearDrag(event)" ondrop="drop(event, 'bugs')">
                <div class="section-header" style="color: var(--color-bugs);">
                    <span>🐛 Bug & Problemi</span>
                    <span class="badge-count" id="count-bugs">0</span>
                </div>
                <div class="cards-container"></div>
            </div>

            <div class="section-column" id="col-done" ondragover="allowDrop(event)" ondragleave="clearDrag(event)" ondrop="drop(event, 'done')">
                <div class="section-header" style="color: var(--color-done);">
                    <span>✅ Completati</span>
                    <span class="badge-count" id="count-done">0</span>
                </div>
                <div class="cards-container"></div>
            </div>
        </div>
    </div>

    <div id="codePage" class="page">
        <div class="panel-box">
            <div class="form-grid-code">
                <input type="text" id="codeTitle" placeholder="Titolo script (es. PlayerController.cs)...">
                <select id="codeLang">
                    <option value="C#">C# (Unity)</option>
                    <option value="C++">C++ (Unreal)</option>
                    <option value="GDScript">GDScript (Godot)</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Python">Python</option>
                    <option value="HLSL / Shader">Shader / HLSL</option>
                    <option value="Altro">Altro</option>
                </select>
                <button class="btn-submit" onclick="addCodeScript()">Salva Codice</button>
            </div>
            <textarea id="codeBody" class="code-textarea" placeholder="// Incolla qui il codice dello script..." rows="6"></textarea>
        </div>

        <div class="code-grid" id="codeContainer"></div>
    </div>

    <div id="imagesPage" class="page">
        <div class="panel-box">
            <div class="form-grid-img">
                <input type="text" id="imgTitle" placeholder="Titolo dell'asset...">
                <input type="text" id="imgUrl" placeholder="URL Immagine (es. https://i.imgur.com/...)">
                <input type="text" id="imgDesc" placeholder="Descrizione o note...">
                <button class="btn-submit" onclick="addImageAsset()">Aggiungi Link</button>
            </div>
            <div style="margin-top: 12px; display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 0.85rem; color: var(--text-muted);">Oppure carica file dal PC:</span>
                <input type="file" id="imgFileInput" accept="image/*" style="font-size: 0.85rem;">
            </div>
        </div>

        <div class="image-grid" id="imageContainer"></div>
    </div>

</div>

<script>
// Fallback Immagine
const fallbackImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='200' viewBox='0 0 300 200'><rect width='100%' height='100%' fill='%230d1322'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23f87171' font-family='sans-serif' font-size='14'>⚠️ Immagine Non Trovata</text></svg>";

let currentUser = null;
let userProjects = [];
let activeProjectId = null;
let currentNotes = [];
let currentScripts = [];
let currentImages = [];

// =========================
// AUTHENTICATION FUNCTIONS
// =========================

function showLogin() {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('authSubtitle').innerText = 'Accedi al tuo Game Dev Studio';
    document.getElementById('authMessage').innerText = '';
}

function showRegister() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
    document.getElementById('authSubtitle').innerText = 'Crea il tuo account DevVault';
    document.getElementById('authMessage').innerText = '';
}

function showAuthMessage(message, isError = false) {
    const element = document.getElementById('authMessage');
    element.innerText = message;
    element.style.color = isError ? '#f87171' : '#34d399';
}

async function loginUser() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) return showAuthMessage('Inserisci email e password.', true);
    showAuthMessage('Accesso in corso...');

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) return showAuthMessage('Errore: ' + error.message, true);

    currentUser = data.user;
    showAuthMessage('Accesso effettuato!');
    document.getElementById('authScreen').style.display = 'none';
    await initApp();
}

async function registerUser() {
    const email = document.getElementById('registerEmail').value.trim();
    const password = document.getElementById('registerPassword').value;
    const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

    if (!email || !password || !passwordConfirm) return showAuthMessage('Compila tutti i campi.', true);
    if (password !== passwordConfirm) return showAuthMessage('Le password non coincidono.', true);
    if (password.length < 6) return showAuthMessage('La password deve avere almeno 6 caratteri.', true);

    showAuthMessage('Creazione account...');
    const { data, error } = await supabaseClient.auth.signUp({ email, password });

    if (error) return showAuthMessage('Errore: ' + error.message, true);

    if (!data.session) {
        showAuthMessage('Account creato! Controlla la tua email per confermare.');
        return;
    }

    currentUser = data.user;
    document.getElementById('authScreen').style.display = 'none';
    await initApp();
}

async function checkAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
        currentUser = session.user;
        document.getElementById('authScreen').style.display = 'none';
        await initApp();
    } else {
        document.getElementById('authScreen').style.display = 'flex';
    }
}

async function logoutUser() {
    await supabaseClient.auth.signOut();
    currentUser = null;
    activeProjectId = null;
    document.getElementById('authScreen').style.display = 'flex';
    showLogin();
}

supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session) {
        currentUser = session.user;
        document.getElementById('authScreen').style.display = 'none';
    } else {
        currentUser = null;
        document.getElementById('authScreen').style.display = 'flex';
    }
});

// =========================
// SUPABASE DATABASE LOGIC
// =========================

async function initApp() {
    await fetchProjects();
}

async function fetchProjects() {
    if (!currentUser) return;

    const { data, error } = await supabaseClient
        .from('projects')
        .select('*')
        .order('created_at', { ascending: true });

    if (error) {
        console.error("Errore recupero progetti:", error);
        return;
    }

    userProjects = data || [];

    if (userProjects.length === 0) {
        // Se l'utente non ha progetti, ne creiamo uno predefinito
        await createDefaultProject();
    } else {
        if (!activeProjectId || !userProjects.find(p => p.id === activeProjectId)) {
            activeProjectId = userProjects[0].id;
        }
        updateProjectSelectUI();
        await loadProjectData();
    }
}

async function createDefaultProject() {
    const { data, error } = await supabaseClient
        .from('projects')
        .insert([{ name: 'Progetto Alpha', user_id: currentUser.id }])
        .select();

    if (error) {
        console.error("Errore creazione progetto predefinito:", error);
        return;
    }

    userProjects = data;
    activeProjectId = data[0].id;
    updateProjectSelectUI();
    await loadProjectData();
}

function updateProjectSelectUI() {
    const select = document.getElementById('projectSelect');
    select.innerHTML = '';
    
    userProjects.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.innerText = p.name;
        if (p.id === activeProjectId) opt.selected = true;
        select.appendChild(opt);
    });

    const activeProjectObj = userProjects.find(p => p.id === activeProjectId);
    document.getElementById('topbarProjectName').innerText = activeProjectObj ? activeProjectObj.name : '';
}

async function switchProject(projectId) {
    activeProjectId = projectId;
    updateProjectSelectUI();
    await loadProjectData();
}

async function createNewProject() {
    const name = prompt("Inserisci il nome del nuovo progetto/gioco:");
    if (!name || name.trim() === '') return;

    const { data, error } = await supabaseClient
        .from('projects')
        .insert([{ name: name.trim(), user_id: currentUser.id }])
        .select();

    if (error) {
        alert("Errore durante la creazione del progetto: " + error.message);
        return;
    }

    userProjects.push(data[0]);
    activeProjectId = data[0].id;
    updateProjectSelectUI();
    await loadProjectData();
}

async function deleteCurrentProject() {
    if (userProjects.length <= 1) {
        alert("Devi mantenere almeno un progetto attivo!");
        return;
    }

    const activeProjectObj = userProjects.find(p => p.id === activeProjectId);
    if (!confirm(`Sei sicuro di voler eliminare interamente "${activeProjectObj.name}"?`)) return;

    const { error } = await supabaseClient
        .from('projects')
        .delete()
        .eq('id', activeProjectId);

    if (error) {
        alert("Errore durante l'eliminazione del progetto: " + error.message);
        return;
    }

    userProjects = userProjects.filter(p => p.id !== activeProjectId);
    activeProjectId = userProjects[0].id;
    updateProjectSelectUI();
    await loadProjectData();
}

async function loadProjectData() {
    if (!activeProjectId) return;
    await Promise.all([renderNotes(), renderCode(), renderImages()]);
}

// =========================
// KANBAN / NOTES
// =========================

async function renderNotes() {
    const { data, error } = await supabaseClient
        .from('notes')
        .select('*')
        .eq('project_id', activeProjectId);

    if (error) return console.error("Errore caricamento note:", error);

    currentNotes = data || [];
    const categories = ['lore', 'ideas', 'todo', 'bugs', 'done'];
    categories.forEach(cat => document.querySelector(`#col-${cat} .cards-container`).innerHTML = '');
    let counts = { lore: 0, ideas: 0, todo: 0, bugs: 0, done: 0 };

    currentNotes.forEach(note => {
        if (!counts.hasOwnProperty(note.category)) return;
        counts[note.category]++;
        const currentPrio = note.priority || 'Nessuna';
        const card = document.createElement('div');
        card.className = `note-card ${note.category}`;
        card.draggable = true;
        card.ondragstart = (e) => e.dataTransfer.setData("text/plain", note.id);

        card.innerHTML = `
            <div class="note-header">
                <span class="note-title">${escapeHtml(note.title)}</span>
                <select class="prio-select ${currentPrio.toLowerCase()}" onchange="updatePriority('${note.id}', this.value)">
                    <option value="Nessuna" ${currentPrio === 'Nessuna' ? 'selected' : ''}>-- Priorità --</option>
                    <option value="Bassa" ${currentPrio === 'Bassa' ? 'selected' : ''}>Bassa</option>
                    <option value="Media" ${currentPrio === 'Media' ? 'selected' : ''}>Media</option>
                    <option value="Alta" ${currentPrio === 'Alta' ? 'selected' : ''}>Alta</option>
                    <option value="Critico" ${currentPrio === 'Critico' ? 'selected' : ''}>Critico</option>
                </select>
            </div>
            <div class="note-body">${escapeHtml(note.body)}</div>
            <div class="note-footer">
                <button class="btn-card delete" onclick="deleteNote('${note.id}')">🗑️ Rimuovi</button>
            </div>
        `;
        document.querySelector(`#col-${note.category} .cards-container`).appendChild(card);
    });

    categories.forEach(cat => document.getElementById(`count-${cat}`).innerText = counts[cat]);
}

async function addNote() {
    const title = document.getElementById('noteTitle').value.trim();
    const body = document.getElementById('noteBody').value.trim();
    const category = document.getElementById('noteCategory').value;
    if (!title) return alert("Inserisci un titolo!");

    const { error } = await supabaseClient
        .from('notes')
        .insert([{
            project_id: activeProjectId,
            user_id: currentUser.id,
            title,
            body,
            category,
            priority: 'Nessuna'
        }]);

    if (error) {
        alert("Errore salvataggio nota: " + error.message);
    } else {
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteBody').value = '';
        await renderNotes();
    }
}

async function updatePriority(id, newPriority) {
    const { error } = await supabaseClient
        .from('notes')
        .update({ priority: newPriority })
        .eq('id', id);

    if (error) console.error("Errore aggiornamento priorità:", error);
    else await renderNotes();
}

async function deleteNote(id) {
    const { error } = await supabaseClient
        .from('notes')
        .delete()
        .eq('id', id);

    if (error) alert("Errore rimozione nota: " + error.message);
    else await renderNotes();
}

function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function clearDrag(e) { e.currentTarget.classList.remove('drag-over'); }

async function drop(e, newCategory) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    const id = e.dataTransfer.getData("text/plain");

    const { error } = await supabaseClient
        .from('notes')
        .update({ category: newCategory })
        .eq('id', id);

    if (error) console.error("Errore spostamento nota:", error);
    else await renderNotes();
}

// =========================
// CODE & SCRIPTS
// =========================

async function renderCode() {
    const { data, error } = await supabaseClient
        .from('scripts')
        .select('*')
        .eq('project_id', activeProjectId);

    if (error) return console.error("Errore caricamento script:", error);

    currentScripts = data || [];
    const container = document.getElementById('codeContainer');
    container.innerHTML = '';

    currentScripts.forEach(item => {
        const card = document.createElement('div');
        card.className = 'code-card';
        card.innerHTML = `
            <div class="code-header">
                <span class="note-title">${escapeHtml(item.title)}</span>
                <span class="code-lang-tag">${escapeHtml(item.lang)}</span>
            </div>
            <div class="code-block">${escapeHtml(item.code)}</div>
            <div class="note-footer">
                <button class="btn-card" onclick="copyCode('${item.id}')">📋 Copia Codice</button>
                <button class="btn-card delete" onclick="deleteCode('${item.id}')">🗑️ Rimuovi</button>
            </div>
        `;
        container.appendChild(card);
    });
}

async function addCodeScript() {
    const title = document.getElementById('codeTitle').value.trim();
    const lang = document.getElementById('codeLang').value;
    const code = document.getElementById('codeBody').value;
    if (!title || !code) return alert("Inserisci titolo e codice!");

    const { error } = await supabaseClient
        .from('scripts')
        .insert([{
            project_id: activeProjectId,
            user_id: currentUser.id,
            title,
            lang,
            code
        }]);

    if (error) {
        alert("Errore salvataggio script: " + error.message);
    } else {
        document.getElementById('codeTitle').value = '';
        document.getElementById('codeBody').value = '';
        await renderCode();
    }
}

async function deleteCode(id) {
    const { error } = await supabaseClient
        .from('scripts')
        .delete()
        .eq('id', id);

    if (error) alert("Errore eliminazione script: " + error.message);
    else await renderCode();
}

function copyCode(id) {
    const script = currentScripts.find(s => s.id === id);
    if (script) {
        navigator.clipboard.writeText(script.code);
        alert("Copiato negli appunti!");
    }
}

// =========================
// GALLERY & IMAGES
// =========================

async function renderImages() {
    const { data, error } = await supabaseClient
        .from('images')
        .select('*')
        .eq('project_id', activeProjectId);

    if (error) return console.error("Errore caricamento immagini:", error);

    currentImages = data || [];
    const container = document.getElementById('imageContainer');
    container.innerHTML = '';

    currentImages.forEach(item => {
        const card = document.createElement('div');
        card.className = 'image-card';
        const safeUrl = escapeHtml(item.url);
        const isDataUri = safeUrl.startsWith('data:');

        card.innerHTML = `
            <div class="image-card-img-wrapper">
                <img src="${safeUrl}" alt="${escapeHtml(item.title)}" onerror="this.onerror=null; this.src='${fallbackImg}';">
            </div>
            <div class="image-card-body">
                <div>
                    <div class="image-title">${escapeHtml(item.title)}</div>
                    <div class="image-desc">${escapeHtml(item.desc)}</div>
                </div>
                <div class="note-footer">
                    ${!isDataUri ? `<a href="${safeUrl}" target="_blank" class="btn-card" style="text-decoration:none;">🔗 Apri Link</a>` : '<span></span>'}
                    <button class="btn-card delete" onclick="deleteImage('${item.id}')">🗑️ Rimuovi</button>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

function addImageAsset() {
    const title = document.getElementById('imgTitle').value.trim();
    const urlInput = document.getElementById('imgUrl').value.trim();
    const desc = document.getElementById('imgDesc').value.trim();
    const fileInput = document.getElementById('imgFileInput');

    if (!title) return alert("Inserisci un titolo per l'immagine!");

    if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = async function(e) {
            await saveImageData(title, e.target.result, desc);
            fileInput.value = '';
        };
        reader.readAsDataURL(fileInput.files[0]);
    } else if (urlInput) {
        saveImageData(title, urlInput, desc);
    } else {
        alert("Incolla l'URL di un'immagine o seleziona un file dal PC!");
    }
}

async function saveImageData(title, url, desc) {
    const { error } = await supabaseClient
        .from('images')
        .insert([{
            project_id: activeProjectId,
            user_id: currentUser.id,
            title,
            url,
            desc
        }]);

    if (error) {
        alert("Errore salvataggio immagine: " + error.message);
    } else {
        document.getElementById('imgTitle').value = '';
        document.getElementById('imgUrl').value = '';
        document.getElementById('imgDesc').value = '';
        await renderImages();
    }
}

async function deleteImage(id) {
    const { error } = await supabaseClient
        .from('images')
        .delete()
        .eq('id', id);

    if (error) alert("Errore eliminazione immagine: " + error.message);
    else await renderImages();
}

// =========================
// UTILITIES & NAVIGATION
// =========================

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('active');
}

function navigateTo(pageId, titleName, btnEl) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.sidebar-menu .sidebar-btn').forEach(b => b.classList.remove('active'));

    document.getElementById(pageId).classList.add('active');
    btnEl.classList.add('active');
    document.getElementById('topbarSectionName').innerText = titleName;

    toggleSidebar();
}

function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// Controllo iniziale della sessione all'avvio
checkAuth();
</script>
